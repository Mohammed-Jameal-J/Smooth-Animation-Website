<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smooth Scroll Animation</title>
<style>
  html, body { margin: 0; height: 600vh; background: #000; overscroll-behavior: none; }
  canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const FRAME_COUNT = 300;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function frameSrc(i) {
  return `Travel/ezgif-frame-${String(i + 1).padStart(3, '0')}.jpg`;
}

const images = new Array(FRAME_COUNT);
let loadedCount = 0;
for (let i = 0; i < FRAME_COUNT; i++) {
  const img = new Image();
  img.src = frameSrc(i);
  img.onload = () => { loadedCount++; if (i === 0) draw(); };
  images[i] = img;
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  draw();
}

function currentFrameIndex() {
  const scrollable = document.body.scrollHeight - window.innerHeight;
  const progress = scrollable > 0 ? window.scrollY / scrollable : 0;
  return Math.min(FRAME_COUNT - 1, Math.floor(progress * FRAME_COUNT));
}

function draw() {
  const img = images[currentFrameIndex()];
  if (!img || !img.complete || img.naturalWidth === 0) return;
  const canvasRatio = canvas.width / canvas.height;
  const imgRatio = img.naturalWidth / img.naturalHeight;
  let w, h;
  if (imgRatio > canvasRatio) {
    h = canvas.height;
    w = h * imgRatio;
  } else {
    w = canvas.width;
    h = w / imgRatio;
  }
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, (canvas.width - w) / 2, (canvas.height - h) / 2, w, h);
}

let ticking = false;
window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => { draw(); ticking = false; });
    ticking = true;
  }
});
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
resize();
</script>
</body>
</html>
